        <script>
                // ...existing code...
        (function(){
            const btn = document.getElementById('meatballButton');
            const menu = document.getElementById('meatballMenu');
            const backdrop = document.getElementById('meatballBackdrop');
            const closeBtn = document.getElementById('meatballClose');
            if (!btn || !menu || !backdrop) return;
            function open(){ menu.style.transform = 'translateY(0)'; backdrop.style.opacity = '1'; backdrop.style.pointerEvents = 'auto'; btn.setAttribute('aria-expanded','true'); btn.style.opacity='0'; btn.style.pointerEvents='none'; }
            function close(){ menu.style.transform = 'translateY(100%)'; backdrop.style.opacity = '0'; backdrop.style.pointerEvents = 'none'; btn.setAttribute('aria-expanded','false'); btn.style.opacity='1'; btn.style.pointerEvents='auto'; }
            btn.addEventListener('click', () => {
                const isOpen = btn.getAttribute('aria-expanded') === 'true';
                if (isOpen) close(); else open();
            });
            backdrop.addEventListener('click', close);
            if (closeBtn) closeBtn.addEventListener('click', close);
            menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setTimeout(close, 200)));
        })();
        </script>
